{% load static %}
<link rel="stylesheet" href="{% static 'css/base.css' %}">

<br>
<h1>Game Platform</h1>

<a href="{% url 'home' %}">Home</a>

{% if user.is_authenticated %}
<p>Hello, <a href="{% url 'user-profile' user.pk %}">{{ user.username }}</a>!</p>
<form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log out</button>
</form>
{% else %}
<p><a href="{% url 'register' %}">Register</a>
    <a href="{% url 'login' %}">Log in</a>
</p>
{% endif %}

<p><a href="{% url 'user-list' %}">[TEMPORARY] Manage users</a></p>

<style>
    img{
        border-radius: 50%;
        height: 30px;
        width: 30px;
    }
</style>

<p>Other Users</p>
<table>
    {% for u in users %}
    <tr>
        <td><img src="{{ u.profile_picture.url }}" alt="{{ u.username }}"></img></td>
        <td><a href="{% url 'user-profile' u.pk %}">{{ u.username }}</a></td>
    </tr>
    {% endfor %}
</table>

<br><br>
{% block content %}
{% endblock %}
