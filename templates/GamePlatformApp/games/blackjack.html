<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/blackjack.css' %}">

</head>

<body>

    <div id="betting-area">
        <label for="bet-amount">Bet amount:</label>
        <input type="number" id="bet-amount" min="1" step="1">
        <button id="place-bet">Start Game</button>
    </div>

    <button id="restart-game" disabled>Restart Game</button>
    
    <div id="players-container"></div>
    <p id="tokens">Your chips: {{ chips }} </p>
    <button id="hit">Hit</button>
    <button id="stand">Stand</button>
    <button id="double-down">Double down</button>
    <button id="split">Split</button>
    <button id="surrender">Surrender</button>
    <p id="insurance-ask">Bet Insurance?</p>
    <button id="insurance">Bet Insurance</button>
    <button id="no-insurance">Don't</button>
    <div id="turn"></div>

    <script>
        const PLAYER_CHIPS = {{ chips }};
    </script>
    <script src="{% static 'js/blackjack.js' %}">
        var static_dir = {% static 'cards' %};
    </script>
</body>

</html>
